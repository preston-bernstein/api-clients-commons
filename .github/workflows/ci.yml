name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # One job runs each gate once. The pre-commit hook runs the same scripts.
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the writing gate diffs against main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install the pinned gate tools
        run: bash scripts/install-gate-tools.sh "$RUNNER_TEMP/gate-tools"
      - name: Core gate
        run: bash scripts/core-validate.sh
      - name: GitHub Actions gate
        run: bash scripts/gha-validate.sh
      - name: Python gate
        run: bash scripts/py-validate.sh
      - name: Shell gate
        run: bash scripts/shell-validate.sh
      - name: Writing gate
        run: bash scripts/writing-validate.sh
