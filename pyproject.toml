[project]
name = "api-clients-commons"
version = "0.0.0"
description = "Shared, authenticated official-API clients for home-lab projects (distinct from scraper-commons, which is stealth/anti-detection scraping) — scaffold; implemented on first use."
requires-python = ">=3.11"
dependencies = ["requests>=2.31.0,<3"]

[dependency-groups]
dev = ["ruff==0.16.1", "mypy==2.4.1", "pytest>=8", "pytest-httpserver", "types-requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_clients_commons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "network: tests requiring live internet access",
]

[tool.ruff]
line-length = 100
# Vendored gate scripts are copied unchanged from the stack packs.
extend-exclude = ["scripts/*-*.py"]

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's default set has widened across releases,
# so an upgrade alone could turn CI red. The ignore list stays empty: an
# exception is a one-line `# noqa: CODE -- reason` next to the code.
select = [
  "E", "F", "I", "N", "UP",
  "S", "B", "BLE",
  "ASYNC",
  "ANN",
  "T20",
  "G",
  "PGH", "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.mypy]
strict = true
files = ["src"]
