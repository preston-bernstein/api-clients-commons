[project]
name = "api-clients-commons"
version = "0.0.0"
description = "Shared, authenticated official-API clients for home-lab projects (distinct from scraper-commons, which is stealth/anti-detection scraping) — scaffold; implemented on first use."
requires-python = ">=3.11"
dependencies = ["requests>=2.31.0,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-httpserver"]
dev = ["ruff==0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_clients_commons"]

[tool.pytest.ini_options]
markers = [
    "network: tests requiring live internet access",
]

[tool.ruff.lint]
# Pin the rule set explicitly. With no select, ruff applies its own default,
# which has widened across releases -- a ruff upgrade alone could then turn CI
# red with no change here. This is ruff's long-standing default, written down.
select = ["E4", "E7", "E9", "F"]
